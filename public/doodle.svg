<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
<!-- Hoạ tiết nền khung chat, lát gạch 400×400.

     Chủ đề cà phê cho khớp tên sản phẩm. Mọi hoạ tiết nằm GỌN trong ô, cách mép
     ≥26px: hoạ tiết cắt ngang mép thì khi lát gạch sẽ lộ đường nối thành lưới ô
     vuông, nhìn ra ngay là ảnh lặp.

     Nét mảnh 1.3 và mờ 0.55 — nền phải chìm hẳn dưới bong bóng tin, đọc chữ mới
     không mỏi mắt. -->
<g fill="none" stroke="#d3c5b2" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" opacity="0.55">

  <!-- Hạt cà phê: bầu dục nghiêng, rãnh giữa cong -->
  <g transform="translate(60,58) rotate(-25)">
    <ellipse cx="0" cy="0" rx="6.5" ry="9"/>
    <path d="M0-8c-2.5 3-2.5 5 0 8s2.5 5 0 8"/>
  </g>
  <g transform="translate(318,266) rotate(35)">
    <ellipse cx="0" cy="0" rx="6" ry="8.5"/>
    <path d="M0-7.5c-2.4 3-2.4 4.7 0 7.5s2.4 4.7 0 7.5"/>
  </g>
  <g transform="translate(150,330) rotate(12)">
    <ellipse cx="-5" cy="0" rx="5" ry="7"/>
    <path d="M-5-6c-2 2.4-2 3.8 0 6s2 3.8 0 6"/>
    <ellipse cx="7" cy="4" rx="5" ry="7" transform="rotate(38 7 4)"/>
    <path d="M7-2c-2 2.4-2 3.8 0 6s2 3.8 0 6" transform="rotate(38 7 4)"/>
  </g>

  <!-- Ly mang đi: nắp + thân côn + gân -->
  <g transform="translate(224,60) rotate(-8)">
    <path d="M-7-9h14l-2 18h-10z"/>
    <path d="M-8.5-9h17"/>
    <path d="M-8.5-12h17v3h-17z"/>
    <path d="M-6-2h12"/>
  </g>

  <!-- Cốc có quai + hơi bốc -->
  <g transform="translate(86,196) rotate(6)">
    <path d="M-8-4h13v8a6.5 6.5 0 0 1-13 0z"/>
    <path d="M5-2h2.6a2.6 2.6 0 0 1 0 5.2H5"/>
    <path d="M-10 10h16"/>
    <path d="M-3-9c0-2.4 2.4-2.4 2.4-4.8M2-9c0-2.4 2.4-2.4 2.4-4.8"/>
  </g>

  <!-- Bình pha kiểu moka -->
  <g transform="translate(300,140) rotate(10)">
    <path d="M-6 10l1.5-9h9l1.5 9z"/>
    <path d="M-5 1l1-8h8l1 8z"/>
    <path d="M4-7l4-2"/>
    <path d="M-4.5-7h9"/>
  </g>

  <!-- Phễu nhỏ giọt đặt trên bình -->
  <g transform="translate(160,120) rotate(-6)">
    <path d="M-8-10h16l-6 8h-4z"/>
    <path d="M-7 4c0-4 3-6 7-6s7 2 7 6v5a3 3 0 0 1-3 3h-8a3 3 0 0 1-3-3z"/>
  </g>

  <!-- Đá viên — nhắc cold brew -->
  <g transform="translate(120,258) rotate(18)">
    <path d="M-6-6h12v12h-12z"/>
    <path d="M-6-6l3-3h12l-3 3M6-6l3-3v12l-3 3"/>
  </g>

  <!-- Chai cold brew có ống hút -->
  <g transform="translate(258,330) rotate(-12)">
    <path d="M-5-8h10v3l2 4v11a2 2 0 0 1-2 2h-10a2 2 0 0 1-2-2V-1l2-4z"/>
    <path d="M-5-11h10v3h-10z"/>
    <path d="M2-11l5-7"/>
  </g>

  <!-- Trái tim latte art -->
  <g transform="translate(352,196) rotate(-14)">
    <path d="M0 7S-7 1-7-3a3.6 3.6 0 0 1 7-1.4A3.6 3.6 0 0 1 7-3c0 4-7 10-7 10z"/>
  </g>

  <!-- Bong bóng tin nhắn -->
  <g transform="translate(46,318) rotate(8)">
    <path d="M-8-6h16v9h-9l-5 4v-4h-2z"/>
  </g>

  <!-- Đồng hồ -->
  <g transform="translate(196,232) rotate(0)">
    <circle cx="0" cy="0" r="8"/>
    <path d="M0-5v5l3.5 2"/>
  </g>

  <!-- Bịch hạt cà phê -->
  <g transform="translate(340,60) rotate(9)">
    <path d="M-6-8h12v16a2 2 0 0 1-2 2h-8a2 2 0 0 1-2-2z"/>
    <path d="M-6-8l2-3h8l2 3"/>
    <ellipse cx="0" cy="2" rx="2.6" ry="3.4"/>
  </g>

  <!-- Muỗng -->
  <g transform="translate(60,120) rotate(-40)">
    <ellipse cx="0" cy="-6" rx="3.4" ry="5"/>
    <path d="M0-1v11"/>
  </g>

  <!-- Đĩa lót + cốc nhìn nghiêng -->
  <g transform="translate(220,182) rotate(4)">
    <path d="M-6-4h9v6a4.5 4.5 0 0 1-9 0z"/>
    <path d="M3-2h2a2 2 0 0 1 0 4H3"/>
    <ellipse cx="-1.5" cy="8" rx="9" ry="2.4"/>
  </g>

  <!-- ── Lớp dày thêm: WhatsApp lát rất dày, thưa quá thì nền trông như bị lỗi tải ── -->

  <!-- Cốc nhìn từ trên xuống -->
  <g transform="translate(276,236) rotate(0)">
    <circle cx="0" cy="0" r="7.5"/>
    <circle cx="0" cy="0" r="4"/>
  </g>

  <!-- Viên đường -->
  <g transform="translate(96,66) rotate(-14)">
    <path d="M-5-5h10v10h-10z"/>
    <path d="M-5-5l2.5-2.5h10l-2.5 2.5M5-5l2.5-2.5v10l-2.5 2.5"/>
  </g>

  <!-- Que khuấy + xoáy hơi -->
  <g transform="translate(184,296) rotate(24)">
    <path d="M0-9v14"/>
    <path d="M-3 5h6"/>
  </g>
  <g transform="translate(330,110) rotate(0)">
    <path d="M-4 4c0-3 3-3 3-6s-3-3-3-6"/>
    <path d="M2 4c0-3 3-3 3-6s-3-3-3-6"/>
  </g>

  <!-- Hạt cà phê nhỏ rải thêm -->
  <g transform="translate(240,128) rotate(52)">
    <ellipse cx="0" cy="0" rx="4.5" ry="6.5"/>
    <path d="M0-5.5c-1.8 2.2-1.8 3.4 0 5.5s1.8 3.4 0 5.5"/>
  </g>
  <g transform="translate(66,240) rotate(-18)">
    <ellipse cx="0" cy="0" rx="4.5" ry="6.5"/>
    <path d="M0-5.5c-1.8 2.2-1.8 3.4 0 5.5s1.8 3.4 0 5.5"/>
  </g>

  <!-- Bánh sừng bò -->
  <g transform="translate(140,196) rotate(8)">
    <path d="M-9 3c1-6 5-8 9-8s8 2 9 8"/>
    <path d="M-9 3c2 2 5 2 9 2s7 0 9-2"/>
    <path d="M-4-4l1 6M0-5v7M4-4l-1 6"/>
  </g>

  <!-- Phin nhỏ -->
  <g transform="translate(360,320) rotate(-8)">
    <path d="M-6-6h12v3h-12z"/>
    <path d="M-5-3h10l-1.5 9h-7z"/>
    <path d="M-7 8h14"/>
  </g>

</g>
</svg>
